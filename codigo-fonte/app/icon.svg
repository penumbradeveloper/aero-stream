<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- Aero: bolha de vidro com um "A" sem barra (o anel da frente faz a barra) e um anel inteiro em volta (metade de trás atrás da bolha, metade da frente na frente). Fundo transparente. -->
<defs>
  <radialGradient id="esfera" cx="38%" cy="30%" r="78%"><stop offset="0" stop-color="#e9fdff"/><stop offset=".28" stop-color="#8ff0ee"/><stop offset=".62" stop-color="#1fb8d8"/><stop offset="1" stop-color="#0a5aa8"/></radialGradient>
  <radialGradient id="luzBaixo" cx="50%" cy="104%" r="62%"><stop offset="0" stop-color="#b8ffd8" stop-opacity=".85"/><stop offset="1" stop-color="#b8ffd8" stop-opacity="0"/></radialGradient>
  <linearGradient id="reflexo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
  <linearGradient id="anelTras" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bff4ff" stop-opacity=".55"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".35"/><stop offset="1" stop-color="#bff4ff" stop-opacity=".55"/></linearGradient>
  <linearGradient id="anelFrente" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d6fff3"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#c9f1ff"/></linearGradient>
  <linearGradient id="play" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9f6ff"/></linearGradient>
  <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#04284f" flood-opacity=".42"/></filter>
  <filter id="sombraP" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#04284f" flood-opacity=".4"/></filter>
  <clipPath id="recorte"><circle cx="512" cy="520" r="300"/></clipPath>
  <!-- no sistema do anel (já girado): a metade de baixo é a que passa NA FRENTE da bolha -->
  <clipPath id="frente"><rect x="0" y="520" width="1024" height="504"/></clipPath>
  <clipPath id="tras"><rect x="0" y="0" width="1024" height="520"/></clipPath>
</defs>
<!-- anel: metade de trás -->
<g transform="rotate(-16 512 520)"><ellipse cx="512" cy="520" rx="462" ry="112" fill="none" stroke="url(#anelTras)" stroke-width="26" clip-path="url(#tras)"/></g>
<!-- a bolha -->
<g filter="url(#sombra)"><circle cx="512" cy="520" r="300" fill="url(#esfera)"/></g>
<g clip-path="url(#recorte)">
  <circle cx="512" cy="520" r="300" fill="url(#luzBaixo)"/>
  <ellipse cx="424" cy="350" rx="220" ry="140" fill="url(#reflexo)" transform="rotate(-24 424 350)" opacity=".8"/>
</g>
<circle cx="512" cy="520" r="298" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="7"/>
<path d="M400 730 L512 378 L624 730" fill="none" stroke="url(#play)" stroke-width="70" stroke-linecap="round" stroke-linejoin="round" filter="url(#sombraP)"/>
<!-- anel: metade da frente -->
<g transform="rotate(-16 512 520)" filter="url(#sombraP)"><ellipse cx="512" cy="520" rx="462" ry="112" fill="none" stroke="url(#anelFrente)" stroke-width="26" stroke-linecap="round" clip-path="url(#frente)"/></g>
<!-- bolhinhas -->
<g filter="url(#sombraP)">
  <circle cx="812" cy="214" r="58" fill="url(#esfera)"/><ellipse cx="795" cy="194" rx="28" ry="17" fill="#fff" opacity=".85" transform="rotate(-30 795 194)"/>
  <circle cx="906" cy="338" r="32" fill="url(#esfera)"/><ellipse cx="896" cy="327" rx="15" ry="9" fill="#fff" opacity=".85" transform="rotate(-30 896 327)"/>
  <circle cx="726" cy="124" r="22" fill="url(#esfera)"/><ellipse cx="719" cy="117" rx="10" ry="6" fill="#fff" opacity=".85" transform="rotate(-30 719 117)"/>
</g>
</svg>
